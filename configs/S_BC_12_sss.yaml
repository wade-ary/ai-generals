run_name: S_BC_12_SSS

# Match the map/game distribution used by S/sss.
pad_to: 12
min_grid_size: 11
max_grid_size: 12
min_generals_distance: 11
max_generals_distance: 17
truncation: 1024
mountain_density_min: 0.18
mountain_density_max: 0.26
castle_val_min: 13
castle_val_max: 18
num_cities_min: 2
num_cities_max: 4
curriculum:

network: history_transformer
init_checkpoint: S/s_bc/BC_S_12_step_090000_init.eqx
ema_checkpoint: ''
ema_decay: 0.999
depth: 4
embed_dim: 352
n_head: 8
ff_factor: 2
patch_size: 2
conv_dim: 256
use_bf16: true

num_envs: 2048
num_steps: 256
num_iters: 1000
minibatch_size: 1024
seed: 44

reward_fn: relative_progress_reward
terminal_reward_scale: 1.0
max_army_ratio: 2.0
max_land_ratio: 2.0
max_castle_ratio: 2.0

num_epochs: 1
lr: 5e-05
final_lr: 0.0
lr_decay_iters: 0
lr_schedule: linear
lr_power_law_numerator: 0.5
lr_power_law_exponent: 1.1
lr_power_law_min: 5e-06
lr_power_law_max: 5e-05
max_grad_norm: 2.0
gamma: 1.0
gamma_end: 1.0
gamma_anneal_iters: 0
iteration_offset: 0
gae_lambda: 0.9
clip_eps: 0.2
vf_coef: 0.5
ent_coef_start: 0.05
ent_coef_end: 0.001
ent_coef_decay_iters: 5000
ent_schedule: power_law
ent_power: 0.2
ent_coef_min: 0.001
target_kl: 0.02
adv_top_frac: 0.25

# Straka-2025-style historical-policy curriculum. The three slots bootstrap
# from the BC-initialized candidate, then become n-1/n-2/n-3 through promotion.
policy_pool_enabled: true
policy_pool_size: 3
policy_pool_paths: []
policy_pool_config_paths: []
policy_pool_eval_every: 200
policy_pool_eval_games: 200
policy_pool_combined_threshold: 0.45
policy_pool_individual_threshold: 0.35

value_loss: ce
num_bins: 128
v_min: -1.0
v_max: 1.0
hl_sigma: 0.04

# No training-time evaluation; save the final model only.
eval_every: 0
eval_every_after: 0
eval_games: 512
eval_ema_only: false
eval_opponent: random
eval_opponent_path: ''
eval_opponent_config: ''
final_stage_rolling_eval: false
ckpt_every: 500
ref_eval_every: 0
ref_eval_games: 500
ref_eval_dir: ''
ref_eval_matrix: ''
ref_eval_min_grid_size:
ref_eval_max_grid_size:
ref_eval_min_generals_distance:
ref_eval_max_generals_distance:
ref_eval_num_cities_min:
ref_eval_num_cities_max:
ref_eval_castle_val_min:
ref_eval_castle_val_max:
ref_eval_truncation:

pool_size: 200000
reset_pool_every: 10
save_every: 500
debug: false
