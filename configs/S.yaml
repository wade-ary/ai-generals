run_name: S
pad_to: 12
min_grid_size: 11
max_grid_size: 12
pool_size: 200000
reset_pool_every: 10

curriculum:
  - min_generals_distance: 2
    max_generals_distance: 6
    num_cities_min: 2
    num_cities_max: 4

  - win_rate_threshold: 0.6
    min_generals_distance: 6
    max_generals_distance: 10
    num_cities_min: 2
    num_cities_max: 4

  - win_rate_threshold: 0.6
    min_generals_distance: 11
    max_generals_distance: 17
    num_cities_min: 2
    num_cities_max: 4

castle_val_min: 13
castle_val_max: 18

network: history_transformer
reward_fn: relative_progress_reward

depth: 4
embed_dim: 352
n_head: 8
ff_factor: 2
patch_size: 2

num_envs: 1024
num_steps: 256
truncation: 1024
num_iters: 50000
minibatch_size: 2048
seed: 44

num_epochs: 1
gamma: 1.0
gae_lambda: 0.9
clip_eps: 0.2
max_grad_norm: 0.267
vf_coef: 0.5
target_kl: 0.02
adv_top_frac: 0.5

ent_schedule: power_law
ent_coef_start: 0.05
ent_power: 0.2
ent_coef_min: 0.001

lr_schedule: power_law
lr_power_law_numerator: 0.5
lr_power_law_exponent: 1.1
lr_power_law_min: 5e-6
lr_power_law_max: 1e-4

eval_every: 50
eval_games: 512
ckpt_every: 500

# Reference ELO disabled for a fresh Colab run. Normal evaluation against
# random and curriculum progression remain enabled above.
ref_eval_every: 0
ref_eval_dir: ""

save_every: 500

use_bf16: true

value_loss: ce
num_bins: 128
v_min: -1.0
v_max: 1.0
hl_sigma: 0.04
